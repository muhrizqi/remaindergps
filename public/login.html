<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Dashboard Pulsa GPS</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6f8}
  .card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:360px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{color:#6b7280;font-size:13px;margin:0 0 20px}
  label{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:4px}
  input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:14px}
  button.primary{width:100%;padding:12px;background:#111827;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
  .forgot{text-align:center;margin-top:14px}
  .forgot a{color:#2563eb;font-size:13px;cursor:pointer;text-decoration:none}
  .msg{font-size:13px;text-align:center;margin-top:12px;padding:8px;border-radius:8px}
  .msg.error{background:#fee2e2;color:#dc2626}
  .msg.success{background:#dcfce7;color:#16a34a}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>📡 Dashboard Pulsa GPS</h1>
  <p class="sub">Masuk untuk mengelola data device</p>

  <form id="loginForm">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Masuk</button>
  </form>

  <div class="forgot"><a onclick="forgotPassword()">Lupa username / password?</a></div>
  <div id="msg" class="msg hidden"></div>
</div>

<script>
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  const data = await res.json();
  if (data.ok) {
    window.location.href = '/';
  } else {
    showMsg(data.error || 'Login gagal.', 'error');
  }
});

async function forgotPassword() {
  showMsg('Mengirim...', 'success');
  try {
    const res = await fetch('/forgot-password', { method: 'POST' });
    const data = await res.json();
    showMsg(data.message || data.error, data.ok ? 'success' : 'error');
  } catch (e) {
    showMsg('Gagal menghubungi server.', 'error');
  }
}
</script>
</body>
</html>
